<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energie-Check – Messe</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark:#070b18;
      --light:#f8fafc;
      --accent:#22ff88;
      --muted:#94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--light);
      color: #0f172a;
      padding-bottom: 90px;
    }

    section {
      padding: 64px 16px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .kicker {
      color: var(--accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .hero {
      background: radial-gradient(circle at top, #16204a, #070b18 70%);
      color: #e5e7eb;
      padding-top: 90px;
    }

    .hero p {
      color: #cbd5f5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: #070b18;
      font-weight: 900;
      border-radius: 14px;
      text-decoration: none;
      margin-top: 18px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 18px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0,0,0,.08);
    }

    .soft {
      background: linear-gradient(135deg, #ecfeff, #f0fdf4);
    }

    .image-wrapper {
      margin: 24px 0;
    }

    .image-wrapper img {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,.15);
      display: block;
    }

    .trust {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,.08);
      text-align: left;
      margin: 28px 0;
    }

    footer {
      background: #020617;
      color: #94a3b8;
      padding: 40px 16px;
      font-size: 0.75rem;
      text-align: center;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      margin: 6px;
    }

    .sticky {
      position: fixed;
      bottom: -100px;
      left: 0;
      width: 100%;
      padding: 10px 12px;
      background: rgba(7,11,24,.95);
      transition: .3s;
      z-index: 999;
    }

    .sticky.visible {
      bottom: 0;
    }

      display: block;
